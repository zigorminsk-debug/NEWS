name: Android Build

# Автосборка приложения TechPulse:
#  - каждая сборка получает порядковый номер (github.run_number),
#    который становится versionCode и частью versionName;
#  - release-APK подписывается постоянным ключом release.keystore;
#  - при пуше в main создаётся GitHub Release с готовыми APK.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка APK №${{ github.run_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # При первом прогоне генерируем gradle-wrapper.jar и коммитим его в репозиторий,
      # чтобы проект можно было собирать локально через ./gradlew.
      - name: Сгенерировать Gradle wrapper (только первый запуск)
        if: github.event_name != 'pull_request'
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/
            git commit -m "chore(ci): сгенерирован Gradle wrapper [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || echo "::warning::Не удалось закоммитить wrapper"
          fi

      - name: Сборка APK (номер сборки = ${{ github.run_number }})
        run: gradle assembleDebug assembleRelease -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Переименовать APK с номером сборки
        run: |
          mv app/build/outputs/apk/release/app-release.apk TechPulse-v1.0.${{ github.run_number }}-release.apk
          mv app/build/outputs/apk/debug/app-debug.apk TechPulse-v1.0.${{ github.run_number }}-debug.apk
          ls -la TechPulse-*.apk

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: TechPulse-build-${{ github.run_number }}
          path: |
            TechPulse-v1.0.${{ github.run_number }}-release.apk
            TechPulse-v1.0.${{ github.run_number }}-debug.apk
          if-no-files-found: error

      # Релиз с APK создаётся только для сборок ветки main
      - name: Создать GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            "TechPulse-v1.0.${{ github.run_number }}-release.apk" \
            "TechPulse-v1.0.${{ github.run_number }}-debug.apk" \
            --title "TechPulse v1.0.${{ github.run_number }} (сборка №${{ github.run_number }})" \
            --notes "Автоматическая сборка №${{ github.run_number }}.

          - Версия: 1.0.${{ github.run_number }} (versionCode ${{ github.run_number }})
          - Коммит: ${{ github.sha }}
          - Release-APK подписан постоянным ключом (release.keystore)

          Требуется Android 8.0+." \
            --latest
